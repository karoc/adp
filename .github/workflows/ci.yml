name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # POSIX (ubuntu-latest) is the blocking primary gate. Windows is a
    # secondary, best-effort portability target: it runs as a non-blocking
    # sentinel so Windows regressions surface early without stalling the
    # primary development flow. Once the Windows leg is consistently green,
    # drop continue-on-error to promote it to a blocking gate.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run aggregate local gate
        shell: bash
        # COVERAGE_PROFILE tells check-coverage.sh to write the raw profile to a
        # known path (and skip cleanup) so the upload step below can archive it.
        #
        # RACE gates the Go race detector inside check-coverage.sh. It stays on
        # for the blocking POSIX leg (the primary concurrency gate). Windows is
        # a non-blocking portability sentinel where -race needs a cgo C toolchain
        # that is not reliably present on the runner, so we skip it there rather
        # than let toolchain noise mask real portability signal.
        env:
          COVERAGE_PROFILE: coverage.out
          RACE: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
        run: scripts/check-all.sh

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: ignore
